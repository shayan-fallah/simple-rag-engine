name: timescaledb

services:
  timescaledb:
    # Postgres 18 with pgvector, pgvectorscale and pg_textsearch (BM25) included
    image: timescale/timescaledb-ha:pg18
    container_name: timescaledb
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      # This image keeps its data in /home/postgres/pgdata/data
      - pgdata_pg18:/home/postgres/pgdata
    restart: unless-stopped

volumes:
  pgdata_pg18:
